title: Site

tabs:

  content:
    label: Content
    icon: folder-structure
    columns:
      main:
        sections:
          pages:
            type: pages

          menusection:
            type: fields
            fields:
              menu:
                type: structure
                fields:
                  title:
                    type: text

                  hasSubmenu:
                    type: toggle
                    text:
                      - 
                        *: 'no'
                      -
                        *: 'yes'
                  link:
                    type: link
                    label: Mainmenu item
                    when:
                      hasSubmenu: false

                  subMenu:
                    type: structure
                    label: Submenu items
                    when:
                      hasSubmenu: true
                    fields:
                      title:
                        type: text

                      subtitle:
                        type: text

                      link:
                        type: link
  
  gameassets:
    label: Game Assets
    icon: box
    columns:
      left:
        width: 1/2
        fields:
          # fields in the left column
          characters:
            type: structure
            fields:
              name:
                type: text
              media:
                type: files
                multiple: false
                layout: card
              text:
                type: writer
                
      right:
        width: 1/2
        fields:
          tracks:
              type: structure
              fields:
                title:
                  type: text

  blog:
    label: Blog
    icon: rss
    extends: layouts/blogLayout